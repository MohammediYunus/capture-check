name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - name: Check installed command outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          CAPTURE_CHECK_SOURCE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          from html.parser import HTMLParser

          class ReportHTML(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = set()
                  self.text = []

              def handle_starttag(self, tag, attrs):
                  self.tags.add(tag)

              def handle_data(self, data):
                  self.text.append(data)

          examples = pathlib.Path(os.environ["CAPTURE_CHECK_SOURCE"]) / "examples"
          with tempfile.TemporaryDirectory(prefix="capture-check-reports-") as report_dir:
              for index, (filename, fps, status, code) in enumerate((
                  ("steady-60.csv", "60", "pass", 0),
                  ("stall-60.jsonl", "60", "fail", 1),
                  ("portty/frames.csv", "30", "pass", 0),
              )):
                  command = ["capture-check", str(examples / filename), "--fps", fps]
                  result = subprocess.run(command, text=True, capture_output=True, check=False)
                  assert result.returncode == code, (result.returncode, result.stdout, result.stderr)
                  report = json.loads(result.stdout)
                  assert report["status"] == status, result.stdout

                  output = pathlib.Path(report_dir) / f"report-{index}.html"
                  html_result = subprocess.run(
                      [*command, "--html", str(output)],
                      text=True, capture_output=True, check=False,
                  )
                  assert html_result.returncode == code, (html_result.returncode, html_result.stdout, html_result.stderr)
                  assert json.loads(html_result.stdout) == report, html_result.stdout
                  document = ReportHTML()
                  document.feed(output.read_text(encoding="utf-8"))
                  assert {"html", "title", "svg"} <= document.tags, document.tags
                  assert "script" not in document.tags, document.tags
                  text = " ".join(document.text)
                  assert pathlib.Path(filename).name in text, text
                  assert str(report["timestamp_count"]) in text, text
                  print(f"{filename}: {status}, exit {code}, matching JSON and offline HTML")
          PY

  macos-example:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile example and run pure timestamp tests (no capture)
        run: |
          mkdir -p build/macos-screencapturekit
          xcrun swiftc -swift-version 5 -warnings-as-errors -target "$(uname -m)-apple-macosx15.0" \
            examples/macos-screencapturekit/Timing.swift \
            examples/macos-screencapturekit/CaptureWindow.swift \
            -o build/macos-screencapturekit/capture-window
          xcrun swiftc -swift-version 5 -warnings-as-errors -target "$(uname -m)-apple-macosx15.0" \
            examples/macos-screencapturekit/Timing.swift \
            examples/macos-screencapturekit/TimingTests.swift \
            -o build/macos-screencapturekit/timing-tests
          build/macos-screencapturekit/timing-tests
          build/macos-screencapturekit/capture-window --help
