name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - name: Check installed command outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          CAPTURE_CHECK_SOURCE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          examples = pathlib.Path(os.environ["CAPTURE_CHECK_SOURCE"]) / "examples"
          for filename, status, code in (("steady-60.csv", "pass", 0), ("stall-60.jsonl", "fail", 1)):
              result = subprocess.run(
                  ["capture-check", str(examples / filename), "--fps", "60"],
                  text=True, capture_output=True, check=False,
              )
              assert result.returncode == code, (result.returncode, result.stdout, result.stderr)
              assert json.loads(result.stdout)["status"] == status, result.stdout
              print(f"{filename}: {status}, exit {code}")
          PY
